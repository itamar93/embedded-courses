# Lab service behind HTTPS. Run from the repository root:
#   DOMAIN=1-2-3-4.sslip.io SITE_ORIGIN=https://embedded-courses.pages.dev docker compose -f deploy/docker-compose.yml up -d --build
services:
  runner:
    build:
      context: ..
      dockerfile: services/runner/Dockerfile
    command: ["runner", "-addr", ":8080", "-courses", "/srv/courses",
              "-qemu", "/usr/local/bin/qemu-system-arm", "-work", "/tmp/builds",
              "-origin", "${SITE_ORIGIN:?set SITE_ORIGIN to the site URL}"]
    entrypoint: []
    restart: unless-stopped
    network_mode: none
    volumes:
      - runner-sock:/run/runner
    environment:
      RUNNER_UNIX_SOCKET: /run/runner/runner.sock
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, for example 1-2-3-4.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - runner-sock:/run/runner
      - caddy-data:/data

volumes:
  runner-sock:
  caddy-data:
