name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npx astro build

  runner:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  labs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Starter and solution of every lab compile
        run: |
          for lab in courses/*/*/lab; do
            module="$(dirname "$lab")"
            echo "::group::$module"
            make -C "$lab" -s all && make -C "$lab" -s clean
            tmp="$(mktemp -d)"
            cp -r "$lab"/. "$tmp"/ && cp -r "$module/solution"/. "$tmp"/
            make -C "$tmp" -s all
            echo "::endgroup::"
          done
